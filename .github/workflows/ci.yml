name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install RISC-V binutils
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends binutils-riscv64-unknown-elf
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Build and check proofs from source
        run: lake --no-cache --wfail build
      - name: Audit axioms including imported model declarations
        run: lake env lean scripts/CheckAxioms.lean
      - name: Generate and execute ELF
        run: |
          .lake/build/bin/cl-asm build
          .lake/build/bin/cl-asm-test build/epoch-at-slot.elf
      - name: Reject corrupted ELF images and tool failures
        run: python3 -m unittest discover -s tests -v
